release:
  name: rc1_single
  candidate: cv05_rtx5070_xlarge_512_focal_es
  notes: Single release model trained on train_df + val_df with a 90/10 group-safe
    validation split for early stopping.
data:
  test_csv: data/raw/test_df.csv
  images_test_dir: data/raw/test_images/test_images
  class_mapping: configs/data/class_mapping.yaml
  num_classes: 20
  image_size: 512
  resize_size: 576
model:
  backbone: convnext_xlarge.fb_in22k_ft_in1k_384
  checkpoint: artifacts/checkpoints/roomclf_convnextxlargefbin22kftin1k384_release_512_cv05_rtx5070_xlarge_512_focal_es.ckpt
postprocess:
  class_bias: null
inference:
  seed: 42
  device: cuda
  batch_size: 64
  num_workers: 0
  tta: false
  validate_after: true
  output_submission: releases/rc1_single/submission.csv
  output_predictions: releases/rc1_single/predictions.parquet
