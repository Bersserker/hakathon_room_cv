<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Type Classifier</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fb;
      color: #172033;
    }

    main {
      width: min(640px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(23, 32, 51, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #5d6678;
    }

    form {
      display: grid;
      gap: 16px;
    }

    input[type="file"] {
      padding: 16px;
      border: 1px dashed #aab3c5;
      border-radius: 16px;
      background: #f9fbff;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #2d6cdf;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    img {
      display: none;
      max-width: 100%;
      max-height: 320px;
      border-radius: 16px;
      object-fit: contain;
      background: #eef2f8;
    }

    .result {
      min-height: 24px;
      padding: 16px;
      border-radius: 16px;
      background: #eef4ff;
      font-size: 16px;
    }

    .error {
      background: #fff0f0;
      color: #9f1d1d;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e5e7eb;
      }

      main {
        background: #111827;
      }

      p {
        color: #9ca3af;
      }

      input[type="file"], .result {
        background: #1f2937;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Классификация помещения</h1>
    <p>Загрузите изображение и нажмите «Отправить», чтобы получить предсказанный класс.</p>

    <form id="upload-form">
      <input id="image-input" name="file" type="file" accept="image/*" required />
      <img id="preview" alt="Предпросмотр изображения" />
      <button id="submit-button" type="submit">Отправить</button>
    </form>

    <div id="result" class="result" aria-live="polite">Результат появится здесь.</div>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const input = document.getElementById("image-input");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    const button = document.getElementById("submit-button");

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = input.files[0];
      if (!file) {
        result.textContent = "Выберите изображение.";
        result.classList.add("error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      result.textContent = "Отправляем изображение...";
      result.classList.remove("error");
      button.disabled = true;

      try {
        const response = await fetch("/predict_upload", {
          method: "POST",
          body: formData,
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Ошибка запроса");
        }

        const percent = (payload.confidence * 100).toFixed(2);
        result.innerHTML = `Класс: <strong>${payload.class_id}</strong> — ${payload.class_name || "без названия"}<br>Уверенность: <strong>${percent}%</strong>`;
      } catch (error) {
        result.textContent = error.message;
        result.classList.add("error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
